name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  live-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: install pinned runsc and busybox
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gvisor.tar.bz2 \
            https://github.com/google/gvisor/releases/download/release-20260817.0/gvisor-x86_64.tar.bz2
          sudo tar -xjf /tmp/gvisor.tar.bz2 -C /usr/local/bin
          sudo chmod +x /usr/local/bin/runsc
          runsc --version
          sudo apt-get update
          sudo apt-get install -y busybox-static
      - name: live T04 T05 T07
        env:
          TURTLE_LIVE_SANDBOX: "1"
        run: cargo test -p turtle-launcher --test live_t04 -- --nocapture

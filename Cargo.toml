[workspace]
resolver = "2"
members = [
    "crates/turtle-policy",
    "crates/turtle-cli",
    "crates/turtle-launcher",
    "crates/turtle-snapshot",
    "tests/reference/turtle-policy-ref",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
saphyr-parser = "=0.0.12"
sha2 = "=0.10.9"
hex = "=0.4.3"
thiserror = "=2.0.20"
clap = { version = "=4.6.7", features = ["derive"] }
proptest = "=1.11.0"
libc = "=0.2.180"
getrandom = "=0.3.4"
turtle-policy = { path = "crates/turtle-policy" }
turtle-snapshot = { path = "crates/turtle-snapshot" }
turtle-launcher = { path = "crates/turtle-launcher" }

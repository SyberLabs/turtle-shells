[workspace]
resolver = "2"
members = ["crates/turtle-policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
saphyr-parser = "=0.0.12"
sha2 = "=0.10.9"
hex = "=0.4.3"
thiserror = "=2.0.20"
turtle-policy = { path = "crates/turtle-policy" }

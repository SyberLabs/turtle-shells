apiVersion: turtle.syberlabs.space/v0alpha1
kind: TurtlePolicy
metadata:
  name: diff-old
spec:
  profile: strict-local-v1
  runtime:
    imageRef: registry:node-worker-v1
    argv: ["/opt/agent/bin/worker"]
    cwd: /workspace/repo
    shell: false
  lifetime:
    maxSeconds: 60
  filesystem:
    snapshotRef: registry:src
    mountAt: /workspace/repo
    writableSubtrees: [src]
    scratchMiB: 1
    exportSubtrees: []
  network:
    mode: broker-only
    rawDestinations: []
  data:
    readableClasses: [internal-source]
    recipients: [owner-local, approved-code-provider]
  credentials:
    bindings: []
    export: false
  grants:
    - id: read
      action: github.repository.read
      resource: registry:src
      recipients: [owner-local, approved-code-provider]
    - id: write
      action: github.repository.write
      resource: registry:src
      recipients: [owner-local]
  mcp:
    enabledTools: []
    resourceReads: false
    prompts: false
    sampling: false
    elicitation: false
    asyncTasks: false
  limits:
    domain:
      providerAttempts: 9
      externalMutations: 1
      inferenceOutputTokens: 0
      outboundPayloadBytes: 1
      memoryMiB: 64
      pids: 8
      cpuMillisPerSecond: 100
    local:
      memoryMiB: 64
      pids: 8
      cpuMillisPerSecond: 100
  delegation:
    maxDepth: 1
    maxLiveChildren: 1
    maxTotalDescendants: 1
    allowedTemplates: [registry:read-only-reviewer]
  audit:
    required: true
    payloadMode: digest-and-metadata
